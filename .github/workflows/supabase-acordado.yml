# O plano grátis do Supabase pausa o projeto depois de alguns dias sem uso, e aí o formulário do site para.
# Este workflow faz, todo dia, uma consulta que chega de verdade ao banco: pede os horários livres
# à function "agenda" (a mesma que o formulário do site usa), que lê a tabela de agendamentos.
# A consulta antiga (REST em agendamentos com a chave pública) era recusada antes de tocar o banco
# e não contava como uso; o projeto pausou em 17/11/2026 mesmo com ela rodando.
# Usa a chave publicável que já está no .env do site (é pública, vai no navegador de qualquer visitante).
name: Supabase acordado

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  cutucar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consultar o banco pela agenda
        run: |
          set -a; . ./.env; set +a
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$VITE_SUPABASE_URL/functions/v1/agenda" \
            -H "Origin: https://www.moveai.tech" -H "Content-Type: application/json" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -d '{"action":"slots"}')
          echo "::notice::Supabase (agenda) respondeu HTTP $code"
          # 540 = projeto pausado; 5xx = fora do ar. Nos dois casos o workflow falha e o GitHub avisa por e-mail.
          [ "$code" != "540" ] && [ "$code" -lt 500 ]
