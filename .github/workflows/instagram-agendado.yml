# Publica os carrosséis agendados em public/ig/agenda.json, sem depender de PC ligado.
# Roda de 30 em 30 minutos, das 7h às 21h30 (horário de Brasília, UTC-3).
# Precisa do segredo IG_TOKEN em Settings > Secrets and variables > Actions.
name: Instagram agendado

on:
  schedule:
    - cron: "*/10 10-23,0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instagram-agendado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publicar o que estiver na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_VERSION: v26.0
        run: node scripts/ig-agendados.mjs
